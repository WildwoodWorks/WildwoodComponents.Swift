name: WildwoodComponentsTestSuite
options:
  bundleIdPrefix: io.wildwoodworks
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  WildwoodComponents:
    path: ".."
configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig
targets:
  WildwoodComponentsTestSuite:
    type: application
    platform: iOS
    sources:
      - TestSuite
    dependencies:
      - package: WildwoodComponents
        products:
          - WildwoodCore
          - WildwoodSwiftUI
    # Custom keys must go through a real (generated) Info.plist — Xcode only
    # honors its own fixed INFOPLIST_KEY_* set, so arbitrary keys passed as
    # build settings are silently dropped. $(VAR) values expand at build time
    # from Config.xcconfig / Local.xcconfig.
    info:
      path: TestSuite/Info.plist
      properties:
        WildwoodAPIBaseURL: "$(WILDWOOD_API_BASE_URL)"
        WildwoodAppId: "$(WILDWOOD_APP_ID)"
        UILaunchScreen: {}
        # Custom URL scheme, so signup deep links and campaign links can be exercised without a
        # web domain or associated-domains entitlement:
        #   xcrun simctl openurl booted "wildwoodtest://signup?tier=pro&addons=docs,api"
        # The Registration & Subscription screen parses it with SignupParams, the signup view
        # applies it (DD-5), and `.wildwoodClient(_:)` hands the same URL to Campaign Attribution.
        CFBundleURLTypes:
          - CFBundleURLName: io.wildwoodworks.WildwoodComponentsTestSuite
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - wildwoodtest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wildwoodworks.WildwoodComponentsTestSuite
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
