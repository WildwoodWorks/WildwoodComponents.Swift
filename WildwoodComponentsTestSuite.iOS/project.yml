name: WildwoodComponentsTestSuite
options:
  bundleIdPrefix: io.wildwoodworks
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
packages:
  WildwoodComponents:
    path: ".."
configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig
targets:
  WildwoodComponentsTestSuite:
    type: application
    platform: iOS
    sources:
      - TestSuite
    dependencies:
      - package: WildwoodComponents
        products:
          - WildwoodCore
          - WildwoodSwiftUI
    # Custom keys must go through a real (generated) Info.plist — Xcode only
    # honors its own fixed INFOPLIST_KEY_* set, so arbitrary keys passed as
    # build settings are silently dropped. $(VAR) values expand at build time
    # from Config.xcconfig / Local.xcconfig.
    info:
      path: TestSuite/Info.plist
      properties:
        WildwoodAPIBaseURL: "$(WILDWOOD_API_BASE_URL)"
        WildwoodAppId: "$(WILDWOOD_APP_ID)"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.wildwoodworks.WildwoodComponentsTestSuite
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
